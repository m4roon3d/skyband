name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only the files the app needs)
        run: |
          mkdir _site
          cp index.html manifest.json sw.js .nojekyll _site/
          cp -r icons _site/icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$url" | grep -q '<title>skyband — world radio</title>'
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "${url}manifest.json" | grep -q '"name": "skyband"'
          curl -fsSLI --retry 3 --retry-delay 5 --retry-all-errors "${url}icons/apple-touch-icon.png" | head -1
