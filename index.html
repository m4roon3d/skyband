      function followGoldenHour() {
        dom.explorePopover.classList.add('hidden');
        const pool = ANCHOR_PLACES.filter((p) => { const h = getLocalTimeInfo(p).hour; return (h >= 5 && h <= 8) || (h >= 16 && h <= 19); });
        const pick = (pool.length ? pool : ANCHOR_PLACES)[Math.floor(Math.random() * (pool.length || ANCHOR_PLACES.length))];
        jumpWithFlightArc(pick, `Golden Hour → ${pick.city} (${getLocalTimeInfo(pick).timeLabel})`, true);
      }

      function toggleWorldTour() {
        dom.explorePopover.classList.add('hidden');
        if (state.tourActive) { stopWorldTour(false); return; }
        state.tourActive = true; state.tourSecondsLeft = 45;
        dom.tourBanner.classList.remove('hidden'); dom.tourStatusTag.textContent = 'ON';
        dom.tourStatusTag.className = 'font-mono-tech text-[9px] px-1.5 py-0.5 rounded bg-[#2ee59d]/20 text-[#2ee59d]';
        flyNextTourStop();
        if (state.tourIntervalId) clearInterval(state.tourIntervalId);
        state.tourIntervalId = setInterval(() => {
          state.tourSecondsLeft -= 1;
          if (state.tourSecondsLeft <= 0) { state.tourSecondsLeft = 45; flyNextTourStop(); }
          dom.tourCountdown.textContent = `${state.tourSecondsLeft}s`;
        }, 1000);
      }

      function flyNextTourStop() {
        const next = pickDestination();
        state.tourSecondsLeft = 45; dom.tourCountdown.textContent = '45s';
        jumpWithFlightArc(next, `World Tour → ${next.city}, ${next.country}`, true);
      }

      function stopWorldTour(silent) {
        if (!state.tourActive) return;
        state.tourActive = false;
        if (state.tourIntervalId) { clearInterval(state.tourIntervalId); state.tourIntervalId = null; }
        dom.tourBanner.classList.add('hidden'); dom.tourStatusTag.textContent = 'OFF';
        dom.tourStatusTag.className = 'font-mono-tech text-[9px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300';
        if (!silent) showToast('Staying in ' + state.location.city);
      }

      function stampPassport(st) {
        if (!st || !st.country || st.country === 'Global') return;
        if (!state.passportCountries.some((c) => c.country.toLowerCase() === st.country.toLowerCase())) {
          state.passportCountries = [{ country: st.country, countryCode: st.countrycode || '', lat: st.geo_lat || state.location.lat, lng: st.geo_long || state.location.lng, city: st.state || st.country }, ...state.passportCountries];
          saveStored('atlasfm_passport', state.passportCountries);
          renderPassport(); showToast(`Passport stamped: ${st.country}`);
        }
      }

      function renderPassport() {
        dom.passportCount.textContent = `${state.passportCountries.length} ${state.passportCountries.length === 1 ? 'country' : 'countries'}`;
        if (state.passportCountries.length === 0) { dom.passportStamps.innerHTML = '<span class="text-[11px] text-slate-500">Play any station to collect stamps.</span>'; return; }
        dom.passportStamps.innerHTML = state.passportCountries.map((c) => `<button type="button" data-stamp-country="${escapeHtml(c.country)}" class="press px-2 py-0.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-[10.5px] font-semibold text-amber-200">${escapeHtml(c.country)}</button>`).join('');
      }

      async function runSmartOmnibox(rawQ) {
        const q = rawQ.trim(); dom.searchDropdown.classList.add('hidden');
        if (!q) { state.searchQuery = ''; state.band = 'all'; state.genre = 'all'; loadStationsForScope(); return; }
        const lower = q.toLowerCase(); let place = null, band = null, genre = null, rem = lower;
        if (/\bfm\b/.test(lower)) { band = 'fm'; rem = rem.replace(/\bfm\b/g, ' '); }
        else if (/\b(am|mw)\b/.test(lower)) { band = 'am'; rem = rem.replace(/\b(am|mw)\b/g, ' '); }
        if (/late\s*night|sleep|calm|chill|rainy/.test(lower)) { genre = 'ambient'; rem = rem.replace(/late\s*night|sleep|calm|chill|rainy/g, ' '); }
        else { for (const g of KNOWN_GENRES) { if (new RegExp(`\\b${g}\\b`, 'i').test(lower)) { genre = g; rem = rem.replace(new RegExp(`\\b${g}\\b`, 'gi'), ' '); break; } } }
        for (const p of ANCHOR_PLACES) {
          const names = [p.city.toLowerCase(), p.state.toLowerCase(), p.country.toLowerCase(), ...(GLOBAL_CITY_ALIASES[p.city.toLowerCase()] || [])];
          if (names.some((n) => n.length >= 3 && lower.includes(n))) { place = p; break; }
        }
        if (place) {
          state.band = band || 'all';
          state.genre = genre && document.querySelector(`.genre-btn[data-genre="${genre}"]`) ? genre : 'all';
          jumpWithFlightArc(place, `Tuned: ${place.city}${band ? ' · ' + band.toUpperCase() : ''}${genre ? ' · ' + genre : ''}`, false);
          return;
        }
        if (band) state.band = band;
        state.searchQuery = rem.trim().length >= 2 ? rem.trim() : q;
        state.activeTab = 'explore';
        await loadStationsForScope();
      }

      async function resolveLocationFromCoords(lat, lng, autoLoad) {
        let resolved = null;
        try {
          const ctrl = new AbortController(), tid = setTimeout(() => ctrl.abort(), 5000);
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=10&addressdetails=1`, { signal: ctrl.signal });
          clearTimeout(tid);
          if (res.ok) {
            const data = await res.json();
            if (data && data.address) {
              const a = data.address;
              resolved = { city: a.city || a.town || a.village || a.municipality || a.city_district || a.suburb || a.state || 'Selected Area', county: a.county || a.state_district || '', state: a.state || a.province || a.region || a.country || '', country: a.country || 'World', countryCode: (a.country_code || '').toUpperCase(), lat, lng };
            }
          }
        } catch (_e) {}
        if (!resolved) {
          let best = ANCHOR_PLACES[0], minD = Infinity;
          ANCHOR_PLACES.forEach((p) => { const d = haversineKm(lat, lng, p.lat, p.lng) ?? Infinity; if (d < minD) { minD = d; best = p; } });
          resolved = { ...best, lat, lng };
        }
        state.location = resolved; state.searchQuery = ''; dom.searchInput.value = ''; dom.searchClearBtn.classList.add('hidden');
        updateLocationUI(); renderVectorMap();
        if (autoLoad) await loadStationsForScope();
      }

      // --- Audio Playback ---
      function destroyHls() { if (hlsInstance) { try { hlsInstance.destroy(); } catch (_e) {} hlsInstance = null; } }
      function clearStall() { if (state.stallTimeoutId) { clearTimeout(state.stallTimeoutId); state.stallTimeoutId = null; } }

      // play() promise rejections are not all "dead stream": ignore ones from a station we already left, ignore
      // interruptions, and treat the browser's autoplay policy (Safari/iOS) as "needs a tap", not "offline".
      function handlePlayRejection(st, err) {
        if (!state.currentStation || state.currentStation.stationuuid !== st.stationuuid) return;
        const name = err && err.name;
        if (name === 'AbortError') return;
        if (name === 'NotAllowedError') {
          clearStall(); state.isLoadingAudio = false; state.isPlaying = false;
          updatePlayerUI(); renderStationList(); showToast('Tap play to start listening');
          return;
        }
        handleStreamError(st);
      }

      function playStation(st, isHeal) {
        if (!st || !st.url_resolved) return;
        if (!isHeal) state.autoHealAttempts = 0;
        if (state.currentStation && state.currentStation.stationuuid === st.stationuuid && state.isPlaying) { dom.audio.pause(); return; }
        state.currentStation = st; state.isLoadingAudio = true; state.isPlaying = false;
        state.recent = [st, ...state.recent.filter((r) => r.stationuuid !== st.stationuuid)].slice(0, 25);
        updatePlayerUI(); renderStationList();
        clearStall();
        state.stallTimeoutId = setTimeout(() => { if (state.isLoadingAudio && state.currentStation && state.currentStation.stationuuid === st.stationuuid) handleStreamError(st); }, 7000);
        try {
          destroyHls(); dom.audio.pause(); dom.audio.removeAttribute('src'); dom.audio.volume = Number(dom.volumeSlider.value);
          const nativeHls = st.isHls && Boolean(dom.audio.canPlayType && dom.audio.canPlayType('application/vnd.apple.mpegurl'));
          if (nativeHls) {
            dom.audio.src = st.url_resolved;
            const p = dom.audio.play(); if (p && p.catch) p.catch((err) => handlePlayRejection(st, err));
          } else if (st.isHls && window.Hls && window.Hls.isSupported()) {
            hlsInstance = new window.Hls({ enableWorker: true, lowLatencyMode: true });
            hlsInstance.loadSource(st.url_resolved); hlsInstance.attachMedia(dom.audio);
            hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => { const p = dom.audio.play(); if (p && p.catch) p.catch((err) => handlePlayRejection(st, err)); });
            hlsInstance.on(window.Hls.Events.ERROR, (_e, d) => { if (d && d.fatal) { destroyHls(); handleStreamError(st); } });
          } else {
            dom.audio.src = st.url_resolved;
            const p = dom.audio.play(); if (p && p.catch) p.catch((err) => handlePlayRejection(st, err));
          }
        } catch (_e) { handleStreamError(st); }
      }

      function handleStreamError(st) {
        clearStall(); state.sessionStreamHealth[st.stationuuid] = 'failed';
        if (!state.currentStation || state.currentStation.stationuuid !== st.stationuuid) return;
        state.isLoadingAudio = false; state.isPlaying = false; updatePlayerUI('ERROR'); renderStationList();
        if (state.autoHeal && state.autoHealAttempts < 2) {
          const next = getVisibleStations().find((s) => s.stationuuid !== st.stationuuid && state.sessionStreamHealth[s.stationuuid] !== 'failed');
          if (next) { state.autoHealAttempts += 1; showToast(`Auto-healing to ${next.name}...`); setTimeout(() => playStation(next, true), 450); return; }
        }
        showToast(`"${st.name}" offline.`, 'Next', () => playAdjacent(1));
      }

      function playAdjacent(delta) {
        const list = getVisibleStations(); if (!list.length) return;
        if (!state.currentStation) { playStation(list[0]); return; }
        const i = list.findIndex((s) => s.stationuuid === state.currentStation.stationuuid);
        playStation(list[i === -1 ? 0 : (i + delta + list.length) % list.length]);
      }

      function toggleFavorite(st) {
        if (!st) return;
        const ex = state.favorites.some((f) => f.stationuuid === st.stationuuid);
        state.favorites = ex ? state.favorites.filter((f) => f.stationuuid !== st.stationuuid) : [st, ...state.favorites];
        saveStored('atlasfm_favorites', state.favorites);
        showToast(ex ? `Removed "${st.name}"` : `Saved "${st.name}"`);
        updatePlayerUI(); renderStationList();
      }

      function getVisibleStations() {
        let base = state.activeTab === 'favorites' ? state.favorites : state.activeTab === 'recent' ? state.recent : state.activeTab === 'featured' ? FEATURED_STATIONS.map(normalizeStation) : state.stations;
        const localTime = getLocalTimeInfo(state.location);
        base = base.map((st) => {
          const u = { ...st, distanceKm: st.hasExactGeo ? haversineKm(state.location.lat, state.location.lng, st.geo_lat, st.geo_long) : st.isLocalMatch ? 12 : null };
          u.signal = computeStreamReliability(u);
          const ts = `${u.tags} ${u.name}`.toLowerCase();
          let aff = 0;
          Object.keys(state.tasteCounts).forEach((k) => { if (ts.includes(k)) aff += Math.min(6, state.tasteCounts[k]); });
          if (state.vibeActive && localTime.vibeTags.some((v) => ts.includes(v))) aff += 18;
          u.smartRank = u.signal.pct + (u.isLocalMatch ? 14 : 0) + (u.band !== 'web' ? 8 : 0) + aff;
          return u;
        });
        if (state.band !== 'all') base = base.filter((s) => s.band === state.band);
        if (state.genre !== 'all') {
          const g = state.genre.toLowerCase();
          base = base.filter((s) => (s.tags || '').toLowerCase().includes(g) || (s.language || '').toLowerCase().includes(g) || (s.name || '').toLowerCase().includes(g));
        }
        const sorted = [...base];
        if (state.sortBy === 'likelihood') sorted.sort((a, b) => b.signal.pct - a.signal.pct);
        else if (state.sortBy === 'popular') sorted.sort((a, b) => (b.clickcount + b.votes) - (a.clickcount + a.votes));
        else if (state.sortBy === 'bitrate') sorted.sort((a, b) => b.bitrate - a.bitrate || b.signal.pct - a.signal.pct);
        else if (state.sortBy === 'distance') sorted.sort((a, b) => (a.distanceKm ?? 99999) - (b.distanceKm ?? 99999));
        else sorted.sort((a, b) => ((state.sessionStreamHealth[a.stationuuid] === 'failed' ? 1 : 0) - (state.sessionStreamHealth[b.stationuuid] === 'failed' ? 1 : 0)) || (b.smartRank - a.smartRank));
        return sorted;
      }

      // --- UI Updates ---
      function updateLocationUI() {
        const loc = state.location, t = getLocalTimeInfo(loc);
        dom.locationHeading.textContent = state.scope === 'global' ? 'World Best' : state.scope === 'country' ? loc.country : state.scope === 'state' ? (loc.state || loc.country) : loc.city;
        dom.locationSubline.textContent = `${[loc.state, loc.country].filter(Boolean).join(', ')} · ${t.timeLabel} (${t.period})`;
        dom.vibeLabel.textContent = state.vibeActive ? `${t.period} On` : t.period;
        dom.btnVibeMatch.className = state.vibeActive ? 'press text-[10.5px] font-bold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-200 inline-flex items-center gap-1' : 'press text-[10.5px] font-semibold px-2 py-0.5 rounded-md bg-white/5 text-slate-300 hover:text-white inline-flex items-center gap-1';
        document.querySelectorAll('.scope-btn').forEach((btn) => {
          const active = btn.dataset.scope === state.scope;
          btn.className = active ? 'scope-btn whitespace-nowrap pb-1 border-b-2 border-[#ff7a18] text-white font-semibold transition' : 'scope-btn whitespace-nowrap pb-1 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition';
        });
      }

      function updateAmbientUI() {
        const mapLabel = { off: 'Off', rain: 'Soft Rain', vinyl: 'Vinyl Warmth', hum: 'Night Hum' };
        dom.ambientStatus.textContent = mapLabel[state.ambientFx] || 'Off';
        dom.fxActiveDot.classList.toggle('hidden', state.ambientFx === 'off');
        document.querySelectorAll('.fx-btn').forEach((btn) => {
          const active = btn.dataset.fx === state.ambientFx;
          btn.className = active ? 'fx-btn press px-2 py-1 rounded-lg text-[11px] font-bold border bg-sky-500/20 border-sky-400/50 text-sky-200' : 'fx-btn press px-2 py-1 rounded-lg text-[11px] font-medium border bg-white/5 border-white/10 text-slate-300 hover:bg-white/10';
        });
      }

      function renderDiagnostics() {
        const d = state.diagnostics;
        dom.diagMirrorPill.textContent = state.usingFallback ? 'BACKUP' : `LIVE · ${d.totalRaw}`;
        dom.diagContent.innerHTML = `<div>Mirror: <span class="text-slate-200">${escapeHtml(d.mirror)}</span></div><div>Bands: ${d.fmCount} FM · ${d.amCount} AM · ${d.hlsCount} HLS</div><div>High Signal (≥80%): ${d.highSignalCount}</div>`;
      }

      function updateControlsUI() {
        document.querySelectorAll('.nav-tab').forEach((btn) => {
          const active = btn.dataset.tab === state.activeTab;
          btn.className = active ? 'nav-tab px-2 py-0.5 rounded-md font-bold bg-white/15 text-white' : 'nav-tab px-2 py-0.5 rounded-md font-medium text-slate-400 hover:text-white';
        });
        document.querySelectorAll('.band-btn').forEach((btn) => {
          const active = btn.dataset.band === state.band;
          btn.className = active ? 'band-btn px-2 py-0.5 rounded-md text-[10.5px] font-bold bg-[#ff7a18]/20 text-amber-200' : 'band-btn px-2 py-0.5 rounded-md text-[10.5px] font-medium bg-white/5 text-slate-400 hover:text-white';
        });
        document.querySelectorAll('.genre-btn').forEach((btn) => {
          const active = btn.dataset.genre === state.genre;
          btn.className = active ? 'genre-btn px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-[#2ee59d]/15 text-[#2ee59d]' : 'genre-btn px-2 py-0.5 rounded-full text-[10.5px] bg-white/5 text-slate-400 hover:text-white';
        });
        dom.activeFilterDot.classList.toggle('hidden', !(state.band !== 'all' || state.genre !== 'all' || state.sortBy !== 'smart' || state.activeTab !== 'explore' || state.vibeActive));
        dom.favCount.textContent = String(state.favorites.length);
        dom.recentCount.textContent = String(state.recent.length);
      }

      function renderStationList() {
        updateControlsUI();
        if (state.isFetching && state.activeTab === 'explore') {
          dom.stationList.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs flex flex-col items-center gap-2.5"><div class="w-5 h-5 border-2 border-[#ff7a18] border-t-transparent rounded-full animate-spin"></div><span>Scanning ${escapeHtml(state.location.city)}...</span></div>`;
          return;
        }
        const list = getVisibleStations();
        renderVectorMap();
        dom.collapsedCountLabel.textContent = `${list.length} stations · ${state.location.city}`;

        if (list.length === 0) {
          dom.stationList.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs space-y-2.5"><p>${state.activeTab === 'favorites' ? 'No saved stations yet.' : state.activeTab === 'recent' ? 'No listening history yet.' : 'No signals matched.'}</p>${state.activeTab === 'explore' ? '<button id="btn-reset-empty" type="button" class="press px-3 py-1 rounded-full bg-[#ff7a18] text-slate-950 font-bold">Reset Filters</button>' : ''}</div>`;
          const rb = document.getElementById('btn-reset-empty');
          if (rb) rb.addEventListener('click', () => { state.band = 'all'; state.genre = 'all'; state.vibeActive = false; state.searchQuery = ''; dom.searchInput.value = ''; updateLocationUI(); loadStationsForScope(); });
          return;
        }

        const favIds = new Set(state.favorites.map((f) => f.stationuuid));
        dom.stationList.innerHTML = list.map((st) => {
          const isCurrent = state.currentStation && state.currentStation.stationuuid === st.stationuuid;
          const isFav = favIds.has(st.stationuuid);
          const sub = [st.freqLabel !== 'WEB' ? st.freqLabel : null, st.state || st.country, st.hasExactGeo && st.distanceKm != null ? `${st.distanceKm.toLocaleString()} km` : null].filter(Boolean).join(' · ');
          return `
            <article data-uuid="${escapeHtml(st.stationuuid)}" class="station-card group rounded-2xl px-2.5 py-2 transition cursor-pointer flex items-center gap-2.5 ${isCurrent ? 'bg-[#ff7a18]/15' : 'hover:bg-white/[0.05]'}">
              <button type="button" data-action="play" data-uuid="${escapeHtml(st.stationuuid)}" class="press w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${isCurrent ? 'bg-[#ff7a18] text-slate-950' : 'bg-white/[0.07] text-slate-200 group-hover:bg-[#ff7a18] group-hover:text-slate-950'}">
                <i data-lucide="${isCurrent && state.isPlaying ? 'pause' : 'play'}" class="w-3.5 h-3.5 fill-current"></i>
              </button>
              <div class="min-w-0 flex-1">
                <p class="text-[13px] font-semibold text-white truncate leading-snug">${escapeHtml(st.name)}</p>
                <p class="text-[11px] text-slate-400 truncate">${escapeHtml(sub)}</p>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                ${renderSignalInline(st.signal)}
                <button type="button" data-action="fav" data-uuid="${escapeHtml(st.stationuuid)}" class="press p-1 rounded-lg ${isFav ? 'text-rose-400' : 'text-slate-600 hover:text-rose-400'}">
                  <i data-lucide="heart" class="w-3.5 h-3.5 ${isFav ? 'fill-current' : ''}"></i>
                </button>
              </div>
            </article>
          `;
        }).join('');
        if (window.lucide) window.lucide.createIcons();
      }

      function updatePlayerUI(override) {
        const st = state.currentStation;
        if (!st) {
          dom.playerTitle.textContent = 'Ready to Tune'; dom.playerSignalSlot.innerHTML = '';
          dom.playerSubtitle.textContent = 'Drag to spin the globe or click any country';
          dom.playerLed.className = 'w-2.5 h-2.5 rounded-full bg-slate-600 shrink-0'; return;
        }
        const sig = computeStreamReliability(st);
        dom.playerTitle.textContent = st.name; dom.playerSignalSlot.innerHTML = renderSignalInline(sig);
        dom.playerSubtitle.textContent = [st.freqLabel !== 'WEB' ? st.freqLabel : null, st.state || st.country, `${st.codec}${st.bitrate ? ' ' + st.bitrate + 'k' : ''}`].filter(Boolean).join(' · ');
        const isFav = state.favorites.some((f) => f.stationuuid === st.stationuuid);
        dom.playerFavBtn.className = isFav ? 'press w-8 h-8 rounded-full bg-rose-500/15 text-rose-400 flex items-center justify-center' : 'press w-8 h-8 rounded-full hover:bg-white/10 text-slate-400 flex items-center justify-center';
        if (override === 'ERROR') dom.playerLed.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0';
        else if (state.isLoadingAudio) dom.playerLed.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse shrink-0';
        else if (state.isPlaying) dom.playerLed.className = 'w-2.5 h-2.5 rounded-full bg-[#2ee59d] led-live shrink-0';
        else dom.playerLed.className = 'w-2.5 h-2.5 rounded-full bg-slate-500 shrink-0';
        dom.btnPlayPause.innerHTML = `<i data-lucide="${state.isPlaying ? 'pause' : 'play'}" class="w-4 h-4 fill-current"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }

      function renderQuickCities() {
        dom.quickCities.innerHTML = ANCHOR_PLACES.slice(0, 6).map((p) => `<button type="button" data-anchor-city="${escapeHtml(p.city)}" class="press px-2 py-0.5 rounded-lg bg-white/5 hover:bg-[#ff7a18] hover:text-slate-950 text-[10.5px] font-medium text-slate-300">${escapeHtml(p.city)}</button>`).join('');
      }

      function renderSearchDropdown(query) {
        const q = query.trim().toLowerCase();
        if (!q) { dom.searchDropdown.classList.add('hidden'); return; }
        const matched = ANCHOR_PLACES.filter((p) => {
          const al = GLOBAL_CITY_ALIASES[p.city.toLowerCase()] || [];
          return p.city.toLowerCase().includes(q) || p.state.toLowerCase().includes(q) || p.country.toLowerCase().includes(q) || al.some((a) => a.includes(q));
        }).slice(0, 4);
        let html = matched.map((p) => `<button type="button" data-pick-place="${escapeHtml(p.city)}" class="w-full text-left px-3.5 py-2 hover:bg-white/10 flex items-center justify-between text-xs text-slate-100"><span class="font-semibold">${escapeHtml(p.city)}</span><span class="text-slate-400">${escapeHtml(p.country)}</span></button>`).join('');
        html += `<button type="button" data-search-live="${escapeHtml(query.trim())}" class="w-full text-left px-3.5 py-2 hover:bg-[#ff7a18]/20 border-t border-white/10 text-xs text-amber-300 font-semibold">Smart tune "${escapeHtml(query.trim())}"</button>`;
        dom.searchDropdown.innerHTML = html; dom.searchDropdown.classList.remove('hidden');
      }

      function setSleepTimer(min) {
        if (state.sleepIntervalId) { clearInterval(state.sleepIntervalId); state.sleepIntervalId = null; }
        state.sleepSecondsLeft = min * 60;
        if (state.sleepSecondsLeft <= 0) { dom.sleepCountdown.classList.add('hidden'); return; }
        dom.sleepCountdown.classList.remove('hidden');
        const tick = () => { dom.sleepCountdown.textContent = `${String(Math.floor(state.sleepSecondsLeft / 60)).padStart(2, '0')}:${String(state.sleepSecondsLeft % 60).padStart(2, '0')}`; };
        tick();
        state.sleepIntervalId = setInterval(() => {
          state.sleepSecondsLeft -= 1;
          if (state.sleepSecondsLeft <= 0) { clearInterval(state.sleepIntervalId); state.sleepIntervalId = null; dom.sleepSelect.value = '0'; dom.sleepCountdown.classList.add('hidden'); dom.audio.pause(); showToast('Sleep timer finished'); }
          else tick();
        }, 1000);
      }

      function showToast(msg, actionText, actionFn) {
        if (state.toastTimerId) clearTimeout(state.toastTimerId);
        dom.toastMessage.textContent = msg;
        if (actionText && typeof actionFn === 'function') {
          dom.toastAction.textContent = actionText; dom.toastAction.classList.remove('hidden');
          dom.toastAction.onclick = () => { dom.toast.classList.add('hidden'); actionFn(); };
        } else { dom.toastAction.classList.add('hidden'); dom.toastAction.onclick = null; }
        dom.toast.classList.remove('hidden');
        state.toastTimerId = setTimeout(() => dom.toast.classList.add('hidden'), 4000);
      }

      function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
      function closePopovers(keep) {
        if (keep !== 'status') dom.statusPopover.classList.add('hidden');
        if (keep !== 'explore') dom.explorePopover.classList.add('hidden');
        if (keep !== 'more') dom.playerMorePopover.classList.add('hidden');
      }

      function bindEvents() {
        document.getElementById('map-mode-switcher').addEventListener('click', (e) => {
          const b = e.target.closest('.proj-btn'); if (b) setMapProjection(b.dataset.proj);
        });
        dom.btnZoomIn.addEventListener('click', () => {
          if ((state.projMode === 'street' || state.projMode === 'satellite') && leafMap) { leafMap.zoomIn(); return; }
          if (state.projMode === 'globe') globeScale = Math.min(1800, globeScale * 1.25);
          else flatTransform.k = Math.min(8, flatTransform.k * 1.25);
          renderVectorMap();
        });
        dom.btnZoomOut.addEventListener('click', () => {
          if ((state.projMode === 'street' || state.projMode === 'satellite') && leafMap) { leafMap.zoomOut(); return; }
          if (state.projMode === 'globe') globeScale = Math.max(140, globeScale * 0.8);
          else flatTransform.k = Math.max(0.8, flatTransform.k * 0.8);
          renderVectorMap();
        });
        dom.btnZoomReset.addEventListener('click', () => {
          if ((state.projMode === 'street' || state.projMode === 'satellite') && leafMap) { leafMap.setView([20, 10], 2); return; }
          const { w, h } = getMapDimensions();
          globeScale = Math.min(w, h) * 0.38;
          flatTransform = { k: 1, x: 0, y: 0 };
          renderVectorMap();
        });

        dom.btnClosePopup.addEventListener('click', () => dom.mapPopup.classList.add('hidden'));
        dom.btnPopupPlay.addEventListener('click', () => {
          if (state.popupStation) { playStation(state.popupStation); dom.mapPopup.classList.add('hidden'); }
        });

        dom.btnBrandStatus.addEventListener('click', (e) => { e.stopPropagation(); closePopovers('status'); dom.statusPopover.classList.toggle('hidden'); });
        dom.btnExplore.addEventListener('click', (e) => { e.stopPropagation(); closePopovers('explore'); dom.explorePopover.classList.toggle('hidden'); });
        dom.btnPlayerMore.addEventListener('click', (e) => { e.stopPropagation(); closePopovers('more'); dom.playerMorePopover.classList.toggle('hidden'); });

        dom.btnCollapseSheet.addEventListener('click', () => { state.sheetOpen = false; dom.stationSheet.classList.add('hidden'); dom.btnExpandSheet.classList.remove('hidden'); });
        dom.btnExpandSheet.addEventListener('click', () => { state.sheetOpen = true; dom.btnExpandSheet.classList.add('hidden'); dom.stationSheet.classList.remove('hidden'); });

        dom.modeSpinGlobe.addEventListener('click', () => { dom.explorePopover.classList.add('hidden'); spinGlobe(); });
        dom.modeFollowNight.addEventListener('click', followTheNight);
        dom.modeGoldenHour.addEventListener('click', followGoldenHour);
        dom.modeWorldTour.addEventListener('click', toggleWorldTour);
        dom.btnTourSkip.addEventListener('click', flyNextTourStop);
        dom.btnTourStop.addEventListener('click', () => stopWorldTour(false));

        dom.quickCities.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-anchor-city]'); if (!btn) return;
          dom.explorePopover.classList.add('hidden'); stopWorldTour(true);
          const p = ANCHOR_PLACES.find((x) => x.city === btn.dataset.anchorCity);
          if (p) jumpWithFlightArc(p, null, false);
        });

        dom.passportStamps.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-stamp-country]'); if (!btn) return;
          const entry = state.passportCountries.find((c) => c.country === btn.dataset.stampCountry);
          if (entry) {
            dom.statusPopover.classList.add('hidden');
            state.location = { city: entry.city || entry.country, county: '', state: '', country: entry.country, countryCode: entry.countryCode, lat: entry.lat, lng: entry.lng };
            state.scope = 'country'; updateLocationUI(); flyMapToScope(); loadStationsForScope();
          }
        });

        document.getElementById('ambient-modes').addEventListener('click', (e) => { const btn = e.target.closest('.fx-btn'); if (btn) startAmbientFx(btn.dataset.fx); });
        dom.ambientVolume.addEventListener('input', () => { if (ambientGain) ambientGain.gain.value = Number(dom.ambientVolume.value); });

        dom.btnAutoHeal.addEventListener('click', () => {
          state.autoHeal = !state.autoHeal; dom.btnAutoHeal.textContent = state.autoHeal ? 'ON' : 'OFF';
          dom.btnAutoHeal.className = state.autoHeal ? 'press font-mono-tech text-[10px] font-bold px-2 py-0.5 rounded bg-[#2ee59d]/20 text-[#2ee59d]' : 'press font-mono-tech text-[10px] font-bold px-2 py-0.5 rounded bg-white/10 text-slate-400';
        });
        dom.btnToggleTerminator.addEventListener('click', () => {
          state.showTerminator = !state.showTerminator; dom.btnToggleTerminator.textContent = state.showTerminator ? 'ON' : 'OFF';
          dom.btnToggleTerminator.className = state.showTerminator ? 'press font-mono-tech text-[10px] font-bold px-2 py-0.5 rounded bg-[#2ee59d]/20 text-[#2ee59d]' : 'press font-mono-tech text-[10px] font-bold px-2 py-0.5 rounded bg-white/10 text-slate-400';
          renderVectorMap();
        });

        dom.btnToggleFilters.addEventListener('click', () => { state.filtersOpen = !state.filtersOpen; dom.filterShelf.classList.toggle('hidden', !state.filtersOpen); });
        dom.btnVibeMatch.addEventListener('click', () => { state.vibeActive = !state.vibeActive; updateLocationUI(); renderStationList(); });
        dom.btnSmartPlay.addEventListener('click', () => { const top = getVisibleStations().find((s) => state.sessionStreamHealth[s.stationuuid] !== 'failed'); if (top) playStation(top); });

        document.getElementById('scope-scrubber').addEventListener('click', (e) => {
          const btn = e.target.closest('.scope-btn'); if (!btn) return;
          stopWorldTour(true); state.scope = btn.dataset.scope; state.activeTab = 'explore'; state.searchQuery = '';
          dom.searchInput.value = ''; dom.searchClearBtn.classList.add('hidden');
          updateLocationUI(); flyMapToScope(); loadStationsForScope();
        });

        document.querySelectorAll('.nav-tab').forEach((btn) => btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; renderStationList(); }));
        document.getElementById('band-chips').addEventListener('click', (e) => { const b = e.target.closest('.band-btn'); if (b) { state.band = b.dataset.band; renderStationList(); } });
        document.getElementById('genre-chips').addEventListener('click', (e) => { const g = e.target.closest('.genre-btn'); if (g) { state.genre = g.dataset.genre; renderStationList(); } });
        dom.sortSelect.addEventListener('change', () => { state.sortBy = dom.sortSelect.value; renderStationList(); });

        dom.stationList.addEventListener('click', (e) => {
          const act = e.target.closest('[data-action]'), card = e.target.closest('.station-card');
          const uuid = act ? act.dataset.uuid : card ? card.dataset.uuid : null; if (!uuid) return;
          const st = [...getVisibleStations(), ...state.stations, ...state.favorites, ...state.recent].find((s) => s.stationuuid === uuid); if (!st) return;
          if (act && act.dataset.action === 'fav') { e.stopPropagation(); toggleFavorite(st); return; }
          playStation(st);
        });

        dom.searchInput.addEventListener('input', () => { dom.searchClearBtn.classList.toggle('hidden', !dom.searchInput.value); renderSearchDropdown(dom.searchInput.value); });
        dom.searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runSmartOmnibox(dom.searchInput.value); } });
        dom.searchClearBtn.addEventListener('click', () => { dom.searchInput.value = ''; state.searchQuery = ''; dom.searchClearBtn.classList.add('hidden'); dom.searchDropdown.classList.add('hidden'); loadStationsForScope(); });
        dom.searchDropdown.addEventListener('click', (e) => {
          const p = e.target.closest('[data-pick-place]');
          if (p) { const pl = ANCHOR_PLACES.find((x) => x.city === p.dataset.pickPlace); if (pl) jumpWithFlightArc(pl, null, false); dom.searchDropdown.classList.add('hidden'); return; }
          const l = e.target.closest('[data-search-live]'); if (l) runSmartOmnibox(l.dataset.searchLive);
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('#search-dropdown') && e.target !== dom.searchInput) dom.searchDropdown.classList.add('hidden');
          if (!e.target.closest('#status-popover') && !e.target.closest('#explore-popover') && !e.target.closest('#player-more-popover')) closePopovers();
        });

        dom.btnLocate.addEventListener('click', () => {
          stopWorldTour(true);
          if (!navigator.geolocation) { showToast('Click any country on the map to set location.'); return; }
          showToast('Finding your location...');
          navigator.geolocation.getCurrentPosition(
            async (pos) => { state.scope = 'nearby'; await resolveLocationFromCoords(pos.coords.latitude, pos.coords.longitude, true); flyMapToScope(); },
            () => showToast('Location declined — click anywhere on the globe.'), { timeout: 6000 }
          );
        });

        dom.btnPlayPause.addEventListener('click', togglePlayPause);
        dom.btnPrev.addEventListener('click', () => playAdjacent(-1));
        dom.btnNext.addEventListener('click', () => playAdjacent(1));
        dom.playerFavBtn.addEventListener('click', () => { if (state.currentStation) toggleFavorite(state.currentStation); });
        dom.volumeSlider.addEventListener('input', () => { dom.audio.volume = Number(dom.volumeSlider.value); dom.audio.muted = dom.audio.volume === 0; updateVolumeIcon(); });
        dom.btnMute.addEventListener('click', () => { dom.audio.muted = !dom.audio.muted; updateVolumeIcon(); });
        dom.sleepSelect.addEventListener('change', () => setSleepTimer(Number(dom.sleepSelect.value) || 0));

        dom.audio.addEventListener('playing', () => {
          clearStall(); state.isLoadingAudio = false; state.isPlaying = true; state.autoHealAttempts = 0;
          if (state.currentStation) {
            state.sessionStreamHealth[state.currentStation.stationuuid] = 'verified';
            (state.currentStation.tags || '').toLowerCase().split(',').map((t) => t.trim()).filter(Boolean).slice(0, 3).forEach((t) => { state.tasteCounts[t] = (state.tasteCounts[t] || 0) + 1; });
            saveStored('atlasfm_taste', state.tasteCounts);
            stampPassport(state.currentStation);
          }
          updatePlayerUI(); renderStationList();
        });
        dom.audio.addEventListener('pause', () => { clearStall(); state.isLoadingAudio = false; state.isPlaying = false; updatePlayerUI(); renderStationList(); });
        dom.audio.addEventListener('error', () => { if (state.currentStation) handleStreamError(state.currentStation); });

        document.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return; // leave browser shortcuts (Cmd+G, Ctrl+M…) alone
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // search box, sliders, selects keep their own keys
          if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
          else if (e.key === 'ArrowRight') playAdjacent(1);
          else if (e.key === 'ArrowLeft') playAdjacent(-1);
          else if (e.key === '/') { e.preventDefault(); dom.searchInput.focus(); }
          else if (e.key.toLowerCase() === 'g') spinGlobe();
          else if (e.key.toLowerCase() === 'm') { dom.audio.muted = !dom.audio.muted; updateVolumeIcon(); }
        });
      }

      function togglePlayPause() {
        if (!state.currentStation) { const list = getVisibleStations(); if (list.length) playStation(list[0]); return; }
        if (state.isPlaying) dom.audio.pause(); else playStation(state.currentStation);
      }

      function spinGlobe() {
        stopWorldTour(true);
        const pick = pickDestination();
        jumpWithFlightArc(pick, `Landed in ${pick.city}, ${pick.country}`, false);
      }

      function updateVolumeIcon() {
        const ic = dom.audio.muted || dom.audio.volume === 0 ? 'volume-x' : dom.audio.volume < 0.5 ? 'volume-1' : 'volume-2';
        dom.btnMute.innerHTML = `<i data-lucide="${ic}" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }

      const FONT_THEMES = {
        modern: { label: 'Modern', display: "'Space Grotesk', sans-serif", body: "'Inter', sans-serif" },
        editorial: { label: 'Editorial', display: "'Instrument Serif', Georgia, serif", body: "'Plus Jakarta Sans', sans-serif" },
        clean: { label: 'Clean', display: "'Outfit', sans-serif", body: "'DM Sans', sans-serif" },
        studio: { label: 'Studio', display: "'Syne', sans-serif", body: "'Inter', sans-serif" },
        mono: { label: 'Mono', display: "'JetBrains Mono', monospace", body: "'JetBrains Mono', monospace" }
      };

      function applyFontTheme(key) {
        const theme = FONT_THEMES[key] || FONT_THEMES.modern;
        state.fontTheme = key in FONT_THEMES ? key : 'modern';
        document.documentElement.style.setProperty('--font-display', theme.display);
        document.documentElement.style.setProperty('--font-body', theme.body);
        saveStored('skyband_font', state.fontTheme);
        const lbl = document.getElementById('active-font-name');
        if (lbl) lbl.textContent = theme.label;
        document.querySelectorAll('.font-opt-btn').forEach((btn) => {
          const active = btn.dataset.font === state.fontTheme;
          btn.className = active
            ? 'font-opt-btn press px-2 py-1 rounded-lg text-[10.5px] font-bold border bg-[#ff7a18]/20 border-[#ff7a18]/60 text-amber-200'
            : 'font-opt-btn press px-2 py-1 rounded-lg text-[10.5px] font-medium border bg-white/5 border-white/10 text-slate-300 hover:bg-white/10';
        });
      }

      function init() {
        if (window.lucide) window.lucide.createIcons();
        applyFontTheme(state.fontTheme);
        const fs = document.getElementById('font-switcher');
        if (fs) fs.addEventListener('click', (e) => { const b = e.target.closest('.font-opt-btn'); if (b) applyFontTheme(b.dataset.font); });
        renderQuickCities(); renderPassport(); updateAmbientUI(); updateLocationUI(); updatePlayerUI();
        bindEvents(); initVectorMap(); loadStationsForScope();
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>
</html>
